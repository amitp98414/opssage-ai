services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: opssage-backend-local-ai
    environment:
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./opssage.db}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: opssage-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: opssage-ollama-model-init
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve >/tmp/ollama.log 2>&1 &
        pid=$$!;
        sleep 3;
        ollama pull "$${OLLAMA_MODEL}";
        kill $$pid || true;
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_models:
